
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 6px;
            font-family: Arial, sans-serif;
        }

        .layout {
            display: grid;
            grid-template-columns: 160px minmax(0, 1fr) 180px;
            grid-template-rows: 48px minmax(300px, 1fr) 48px;
            min-height: 420px;
            height: calc(100vh - 12px);
            border: 1px solid #aaa;
            overflow: hidden;
        }

        /* Top bar */
        .top_bar {
            grid-column: 1 / 4;
            grid-row: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            background: #f0f0f0;
            border-bottom: 1px solid #aaa;
            color: #888;
            font-size: 14px;
            font-weight: 600;
        }

        .top_bar_title {
            flex: 1;
            text-align: center;
        }

        /* Left panel */
        .panel_left {
            grid-column: 1;
            grid-row: 2 / 4;
            background: #d6d6d6;
        }

        /* Main content */
        .content {
            grid-column: 2;
            grid-row: 2;
        }

        /* Right panel */
        .panel_right {
            grid-column: 3;
            grid-row: 2;
        }

        /* Bottom bar */
        .bottom_bar {
            grid-column: 2 / 4;
            grid-row: 3;
            background: #fafafa;
            border-left: 1px solid #aaa;
        }

        .panel_left,
        .content,
        .panel_right,
        .bottom_bar {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
            color: #888;
            font-size: 14px;
            font-weight: 600;
        }

        .content,
        .panel_right {
            border-bottom: 1px solid #aaa;
        }

        .content {
            border-right: 1px solid #aaa;
        }

        /* Panel buttons inside the top bar */
        .panel-toggle {
            display: none;
            flex: 0 0 34px;
            width: 34px;
            height: 34px;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 1px solid #aaa;
            border-radius: 4px;
            background: #fff;
            color: #333;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }

        .panel-toggle:hover {
            background: #e5e5e5;
        }

        .panel_left_toggle {
            margin-right: 8px;
        }

        .panel_right_toggle {
            margin-left: 8px;
        }

        /* Medium screens: collapse right panel */
        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 160px minmax(0, 1fr) 0;
            }

            .panel_right {
                display: none;
            }

            .bottom_bar {
                grid-column: 2 / 4;
            }

            .panel_right_toggle {
                display: flex;
            }

            .layout.panel_right_open {
                grid-template-columns: 160px minmax(0, 1fr) 180px;
            }

            .layout.panel_right_open .panel_right {
                display: flex;
                border-left: 1px solid #aaa;
            }
        }

        /* Small screens: collapse both side panels */
        @media (max-width: 600px) {
            .layout {
                grid-template-columns: 0 minmax(0, 1fr) 0;
            }

            .panel_left {
                display: none;
            }

            .content {
                grid-column: 2;
                border-right: none;
            }

            .bottom_bar {
                grid-column: 2 / 4;
                border-left: none;
            }

            .panel_left_toggle {
                display: flex;
            }

            .layout.panel_left_open {
                grid-template-columns: 160px minmax(0, 1fr) 0;
            }

            .layout.panel_left_open .panel_left {
                display: flex;
                border-right: 1px solid #aaa;
            }

            .layout.panel_right_open {
                grid-template-columns: 0 minmax(0, 1fr) 180px;
            }

            .layout.panel_left_open.panel_right_open {
                grid-template-columns: 160px minmax(0, 1fr) 180px;
            }
        }
    </style>
</head>

<body>

    <div class="layout" id="layout">

        <header class="top_bar">

            <button
                class="panel-toggle panel_left_toggle"
                id="panelLeftToggle"
                aria-label="Toggle left panel"
                aria-controls="panelLeft"
                aria-expanded="false">
                ☰
            </button>

            <span class="top_bar_title">Top Bar</span>

            <button
                class="panel-toggle panel_right_toggle"
                id="panelRightToggle"
                aria-label="Toggle right panel"
                aria-controls="panelRight"
                aria-expanded="false">
                ☰
            </button>

        </header>

        <aside class="panel_left" id="panelLeft">
            Panel Left
        </aside>

        <main class="content">
            Content
        </main>

        <aside class="panel_right" id="panelRight">
            Panel Right
        </aside>

        <footer class="bottom_bar">
            Bottom Bar
        </footer>

    </div>

    <script>
        const layout = document.getElementById("layout");

        const panelLeftToggle =
            document.getElementById("panelLeftToggle");

        const panelRightToggle =
            document.getElementById("panelRightToggle");

        function updateButton(button, isOpen) {
            button.setAttribute("aria-expanded", String(isOpen));
            button.textContent = isOpen ? "×" : "☰";
        }

        panelLeftToggle.addEventListener("click", () => {
            const isOpen = layout.classList.toggle("panel_left_open");
            updateButton(panelLeftToggle, isOpen);
        });

        panelRightToggle.addEventListener("click", () => {
            const isOpen = layout.classList.toggle("panel_right_open");
            updateButton(panelRightToggle, isOpen);
        });

        function updateLayout() {
            const width = window.innerWidth;

            if (width > 900) {
                layout.classList.remove(
                    "panel_left_open",
                    "panel_right_open"
                );
            } else if (width > 600) {
                layout.classList.remove("panel_left_open");
            }

            updateButton(
                panelLeftToggle,
                layout.classList.contains("panel_left_open")
            );

            updateButton(
                panelRightToggle,
                layout.classList.contains("panel_right_open")
            );
        }

        window.addEventListener("resize", updateLayout);
        updateLayout();
    </script>

</body>
</html>
