<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Layout</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- External JavaScript -->
    <script src="js/script.js" defer></script>
</head>

<body>

    <div class="layout" id="layout">

        <!-- Top Bar -->
        <header class="top_bar">

            <button class="panel-toggle panel_left_toggle" id="panelLeftToggle" aria-label="Toggle left menu"
                aria-controls="panelLeft" aria-expanded="false">
                ☰
            </button>

            <span class="top_bar_title">Top Bar</span>

            <button class="panel-toggle panel_right_toggle" id="panelRightToggle"
                aria-label="Toggle right content panel" aria-controls="panelRight" aria-expanded="false">
                ▤
            </button>

        </header>

        <!-- Left Panel -->
        <aside class="panel_left" id="panelLeft">
            Panel Left
        </aside>

        <!-- Main Content -->
        <main class="content">
            Content
        </main>

        <!-- Right Panel -->
        <aside class="panel_right" id="panelRight">
            Panel Right
        </aside>

        <!-- Bottom Bar -->
        <footer class="bottom_bar">
            Bottom Bar
        </footer>

    </div>

</body>

</html>
